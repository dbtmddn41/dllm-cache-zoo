[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dllm-cache-zoo"
version = "0.1.0.dev0"
description = "KV cache methods for diffusion language models, selectable by name"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
hf = ["transformers>=4.46", "accelerate>=0.34"]

[project.urls]
Repository = "https://github.com/dbtmddn41/dllm-cache-zoo"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "numpy>=1.26",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dllm_cache_zoo"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "network: needs to download model code or weights",
  "gpu: needs a CUDA device and a released checkpoint",
]
