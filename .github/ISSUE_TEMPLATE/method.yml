name: Suggest a cache method or model
description: Request a method, an additional checkpoint or model family, a measured result, or a correction to a method page.
title: "[Method] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: What would you like to contribute?
      options:
        - Add a cache method
        - Support a method on another model or model family
        - Add or correct an upstream example
        - Contribute a measured result
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Model family
      options:
        - Bidirectional masked diffusion (LLaDA, Dream)
        - Block diffusion (SDAR, Fast-dLLM v2, LLaDA2)
        - Other or unsure
    validations:
      required: true
  - type: input
    id: policy
    attributes:
      label: Method, variant, and checkpoint
      placeholder: e.g. Fast-dLLM v1 prefix on LLaDA-8B-Instruct
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Primary evidence
      description: Link the paper, the authors' example or implementation revision, and any license you found. Say whether the method ships with its own decoding rule.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: How would you use this method?
      description: Describe the pipeline it should work in and any sampler or cache setting that matters.
    validations:
      required: true
